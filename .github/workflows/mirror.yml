name: BloxyNews Mastodon Mirror

on:
  schedule:
    # Once per day.
    # 10:00 UTC = 20:00 Melbourne during standard time,
    # 21:00 Melbourne during daylight saving.
    - cron: "0 10 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloxynews-mastodon-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Restore mirror state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bloxynews-mirror-${{ github.run_id }}
          restore-keys: |
            bloxynews-mirror-

      - name: Run mirror
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python mirror.py

      - name: Save mirror state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bloxynews-mirror-${{ github.run_id }}
